databaseChangeLog:
  - changeSet:
      id: 1-create-user-interactions
      author: elnur.ahmadov
      changes:
        - createTable:
            tableName: user_interactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: event_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false